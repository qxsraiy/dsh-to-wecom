# dsh-to-wecom bundle patch
# 把通知插件插入 DSH profile 的层栈。
# 这里只放无害默认值：密钥请在 profile 的 cordis.patch.yml 里覆盖，
# 或者设环境变量 WECOM_ROBOT_KEY，别把 key 提交进仓库。
- insert:
    - id: wecom-notify
      name: 'dsh-wecom-notify'
      config:
        enabled: true
        # 企业微信群机器人 key（Webhook 里 key= 后面那串）；留空则读 WECOM_ROBOT_KEY
        webhookKey: ''
        # text 纯文本（微信/企业微信都能直接看）| markdown（带颜色标题）
        format: text
        # every-turn 每轮都发 | completed 只发成功结束 | errors-only 只发失败
        notifyOn: every-turn
        includeSubagents: false
        # 企业微信群机器人限流 20 条/分钟，3.2s 一条刚好压在线下
        minGapMs: 3200
        # 0 = 不截断；长内容按 1800 字节自动拆成 [1/3][2/3] 多条
        textLimit: 0
        # 单条总字符上限（超过标“已截断”），防止一轮输出几十 KB 刷屏
        maxChars: 6000
        # 本机控制接口（界面开关读写它），只绑 127.0.0.1
        controlEnabled: true
        controlPort: 8791
